<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 입출고 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="container mx-auto px-4 py-6">
        <!-- 상단 네비게이션 탭 -->
        <div class="flex space-x-2 border-b border-gray-300 pb-3 mb-6 overflow-x-auto">
            <button onclick="switchTab('main')" id="tab-main" class="tab-btn px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow">메인</button>
            <button onclick="switchTab('photos')" id="tab-photos" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">사진폴더</button>
            <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">실시간 메모장</button>
            <button onclick="switchTab('inbound')" id="tab-inbound" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">입고</button>
            <button onclick="switchTab('outbound')" id="tab-outbound" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">출고</button>
            <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">전체현황</button>
        </div>

        <!-- 1. 메인 탭 -->
        <div id="content-main" class="tab-content">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">환영합니다!</h2>
                <p class="text-gray-600">자재 입출고 관리 및 실시간 공유 메모, 사진함 기능을 이용하실 수 있습니다.</p>
            </div>
        </div>

        <!-- 2. 사진폴더 탭 -->
        <div id="content-photos" class="tab-content hidden">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- 좌측: 폴더 관리 -->
                <div class="bg-white p-4 rounded-xl shadow-md md:col-span-1">
                    <h3 class="text-lg font-bold text-gray-800 mb-3">폴더 목록</h3>
                    <div class="flex mb-4">
                        <input type="text" id="new-folder-name" placeholder="새 폴더 이름" class="flex-1 border rounded-l-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="createFolder()" class="bg-blue-600 text-white px-3 py-2 rounded-r-lg text-sm hover:bg-blue-700">생성</button>
                    </div>
                    <div id="folder-list" class="space-y-2 max-h-[500px] overflow-y-auto">
                        <!-- 폴더 목록 동적 생성 -->
                    </div>
                </div>

                <!-- 우측: 사진 관리 -->
                <div class="bg-white p-6 rounded-xl shadow-md md:col-span-3">
                    <div class="flex justify-between items-center mb-4 pb-2 border-b">
                        <h3 id="current-folder-title" class="text-xl font-bold text-gray-800">폴더를 선택해주세요</h3>
                        <div id="photo-upload-area" class="hidden flex items-center space-x-2">
                            <input type="file" id="photo-file-input" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <button onclick="uploadPhoto()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 shadow">사진 업로드</button>
                        </div>
                    </div>
                    <div id="photo-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        <p class="text-gray-500 col-span-full text-center py-10">좌측에서 폴더를 선택하면 사진이 표시됩니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 실시간 메모장 탭 -->
        <div id="content-notes" class="tab-content hidden">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">실시간 공유 메모장</h2>
                <div class="mb-4">
                    <input type="text" id="note-title" placeholder="메모 제목" class="w-full border rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <textarea id="note-content" placeholder="내용을 입력하세요..." rows="3" class="w-full border rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    <button onclick="saveNote()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 shadow">메모 저장</button>
                </div>
                <div id="notes-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                    <!-- 메모 목록 동적 생성 -->
                </div>
            </div>
        </div>

        <!-- 4. 입고 탭 -->
        <div id="content-inbound" class="tab-content hidden">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">자재 입고 관리</h2>
                <p class="text-gray-600">입고 기능 영역입니다.</p>
            </div>
        </div>

        <!-- 5. 출고 탭 -->
        <div id="content-outbound" class="tab-content hidden">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">자재 출고 관리</h2>
                <p class="text-gray-600">출고 기능 영역입니다.</p>
            </div>
        </div>

        <!-- 6. 전체현황 탭 -->
        <div id="content-overview" class="tab-content hidden">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4">전체 재고 현황</h2>
                <p class="text-gray-600">전체현황 영역입니다.</p>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // Supabase 설정 (본인의 Supabase URL과 Anon Key를 입력하세요)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentFolderId = null;
        let currentFolderName = '';

        // 탭 전환 함수
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white', 'shadow');
                el.classList.add('bg-gray-200', 'text-gray-700');
            });

            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('bg-gray-200', 'text-gray-700');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow');

            if (tabName === 'notes') loadNotes();
            if (tabName === 'photos') loadFolders();
        }

        // --- 메모장 관련 함수 ---
        async function saveNote() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            if (!title || !content) return alert('제목과 내용을 모두 입력해주세요.');

            const { error } = await supabase.from('shared_notes').insert([{ title, content, date: new Date().toISOString().split('T')[0] }]);
            if (error) {
                alert('저장 실패: ' + error.message);
            } else {
                document.getElementById('note-title').value = '';
                document.getElementById('note-content').value = '';
                loadNotes();
            }
        }

        async function loadNotes() {
            const { data, error } = await supabase.from('shared_notes').select('*').order('created_at', { ascending: false });
            const listEl = document.getElementById('notes-list');
            if (error) { listEl.innerHTML = '<p class="text-red-500">메모를 불러오지 못했습니다.</p>'; return; }

            listEl.innerHTML = data.map(note => `
                <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg shadow-sm relative">
                    <h3 class="font-bold text-gray-800">${note.title}</h3>
                    <p class="text-gray-600 mt-1 whitespace-pre-wrap text-sm">${note.content}</p>
                    <span class="block text-xs text-gray-400 mt-3">${note.date || ''}</span>
                    <button onclick="deleteNote(${note.id})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 text-xs">삭제</button>
                </div>
            `).join('');
        }

        async function deleteNote(id) {
            if (!confirm('메모를 삭제하시겠습니까?')) return;
            await supabase.from('shared_notes').delete().eq('id', id);
            loadNotes();
        }

        // --- 사진폴더 관련 함수 ---
        async function loadFolders() {
            const { data, error } = await supabase.from('photo_folders').select('*').order('created_at', { ascending: true });
            const listEl = document.getElementById('folder-list');
            if (error) return;

            if (!data || data.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400">생성된 폴더가 없습니다.</p>';
                return;
            }

            listEl.innerHTML = data.map(folder => `
                <div onclick="selectFolder(${folder.id}, '${folder.name}')" class="flex justify-between items-center p-2 rounded-lg cursor-pointer hover:bg-blue-50 border ${currentFolderId === folder.id ? 'bg-blue-100 border-blue-400 font-bold' : 'border-gray-200'}">
                    <span class="text-sm truncate flex-1">${folder.name}</span>
                    <div class="space-x-1">
                        <button onclick="event.stopPropagation(); renameFolder(${folder.id}, '${folder.name}')" class="text-xs text-gray-500 hover:text-blue-600 px-1">수정</button>
                        <button onclick="event.stopPropagation(); deleteFolder(${folder.id})" class="text-xs text-red-400 hover:text-red-600 px-1">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        async function createFolder() {
            const nameInput = document.getElementById('new-folder-name');
            const name = nameInput.value.trim();
            if (!name) return alert('폴더 이름을 입력해주세요.');

            const { error } = await supabase.from('photo_folders').insert([{ name }]);
            if (error) {
                alert('폴더 생성 실패: ' + error.message);
            } else {
                nameInput.value = '';
                loadFolders();
            }
        }

        async function renameFolder(id, oldName) {
            const newName = prompt('변경할 폴더 이름을 입력하세요:', oldName);
            if (!newName || newName.trim() === '' || newName === oldName) return;

            const { error } = await supabase.from('photo_folders').update({ name: newName.trim() }).eq('id', id);
            if (error) {
                alert('이름 변경 실패: ' + error.message);
            } else {
                loadFolders();
                if (currentFolderId === id) {
                    currentFolderName = newName.trim();
                    document.getElementById('current-folder-title').innerText = currentFolderName;
                }
            }
        }

        async function deleteFolder(id) {
            if (!confirm('폴더를 삭제하시겠습니까? 안의 사진들도 함께 삭제됩니다.')) return;
            const { error } = await supabase.from('photo_folders').delete().eq('id', id);
            if (error) {
                alert('삭제 실패: ' + error.message);
            } else {
                if (currentFolderId === id) {
                    currentFolderId = null;
                    document.getElementById('current-folder-title').innerText = '폴더를 선택해주세요';
                    document.getElementById('photo-upload-area').classList.add('hidden');
                    document.getElementById('photo-grid').innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">좌측에서 폴더를 선택하면 사진이 표시됩니다.</p>';
                }
                loadFolders();
            }
        }

        function selectFolder(id, name) {
            currentFolderId = id;
            currentFolderName = name;
            document.getElementById('current-folder-title').innerText = `📂 ${name}`;
            document.getElementById('photo-upload-area').classList.remove('hidden');
            loadFolders();
            loadPhotos();
        }

        async function uploadPhoto() {
            const fileInput = document.getElementById('photo-file-input');
            const file = fileInput.files[0];
            if (!file) return alert('업로드할 사진을 선택해주세요.');

            const fileName = `${Date.now()}_${file.name}`;
            const filePath = `photos/${fileName}`;

            // 1. Supabase Storage에 파일 업로드
            const { data: storageData, error: storageError } = await supabase.storage.from('photo_folder').upload(filePath, file);
            if (storageError) {
                alert('파일 업로드 실패: ' + storageError.message);
                return;
            }

            // 2. 공개 URL 가져오기
            const { data: publicUrlData } = supabase.storage.from('photo_folder').getPublicUrl(filePath);
            const publicUrl = publicUrlData.publicUrl;

            // 3. DB에 사진 정보 저장
            const { error: dbError } = await supabase.from('photos').insert([{
                folder_id: currentFolderId,
                title: file.name,
                file_path: publicUrl
            }]);

            if (dbError) {
                alert('사진 정보 저장 실패: ' + dbError.message);
            } else {
                fileInput.value = '';
                loadPhotos();
            }
        }

        async function loadPhotos() {
            if (!currentFolderId) return;
            const { data, error } = await supabase.from('photos').select('*').eq('folder_id', currentFolderId).order('created_at', { ascending: false });
            const gridEl = document.getElementById('photo-grid');
            if (error) { gridEl.innerHTML = '<p class="text-red-500">사진을 불러오지 못했습니다.</p>'; return; }

            if (!data || data.length === 0) {
                gridEl.innerHTML = '<p class="text-gray-400 col-span-full text-center py-10">등록된 사진이 없습니다.</p>';
                return;
            }

            // 폴더 이동을 위한 전체 폴더 목록 미리 조회
            const { data: folders } = await supabase.from('photo_folders').select('*');

            gridEl.innerHTML = data.map(photo => `
                <div class="bg-gray-50 border rounded-lg p-2 shadow-sm flex flex-col justify-between">
                    <div>
                        <img src="${photo.file_path}" alt="${photo.title}" class="w-full h-32 object-cover rounded-md mb-2 cursor-pointer" onclick="window.open('${photo.file_path}', '_blank')">
                        <p class="text-xs text-gray-700 truncate font-medium">${photo.title}</p>
                    </div>
                    <div class="mt-2 flex justify-between items-center text-xs">
                        <select onchange="movePhoto(${photo.id}, this.value)" class="border rounded px-1 py-1 bg-white text-gray-600">
                            <option value="">폴더 이동</option>
                            ${folders.filter(f => f.id !== currentFolderId).map(f => `<option value="${f.id}">${f.name}</option>`).join('')}
                        </select>
                        <button onclick="deletePhoto(${photo.id})" class="text-red-500 hover:text-red-700">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        async function movePhoto(photoId, targetFolderId) {
            if (!targetFolderId) return;
            const { error } = await supabase.from('photos').update({ folder_id: targetFolderId }).eq('id', photoId);
            if (error) {
                alert('사진 이동 실패: ' + error.message);
            } else {
                loadPhotos();
            }
        }

        async function deletePhoto(id) {
            if (!confirm('사진을 삭제하시겠습니까?')) return;
            const { error } = await supabase.from('photos').delete().eq('id', id);
            if (error) {
                alert('삭제 실패: ' + error.message);
            } else {
                loadPhotos();
            }
        }
    </script>
</body>
</html>
