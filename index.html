        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background: #f8f9fa; color: #333; }
        .nav { display: flex; justify-content: space-around; background: #212529; padding: 12px; margin-bottom: 20px; border-radius: 8px; flex-wrap: wrap; gap: 5px; }
        .nav button { color: #cfd4da; background: none; border: none; font-size: 14px; font-weight: bold; cursor: pointer; padding: 8px; }
        .nav button.active-btn { color: #fff; border-bottom: 2px solid #fff; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 700px; margin: 0 auto; }
        .active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; }
        .form-group textarea { height: 60px; resize: none; }
        button.btn { width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.btn-danger { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 5px 8px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        /* 폴더 스타일 및 접기/펼치기 지원 */
        .category-section { margin-bottom: 25px; background: #fdfdfd; padding: 12px; border: 1px dashed #ced4da; border-radius: 8px; position: relative; transition: all 0.2s; }
        .category-title { font-size: 18px; font-weight: bold; color: #495057; border-left: 4px solid #0d6efd; padding-left: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .items-drag-container { display: block; }
        .items-drag-container.collapsed { display: none !important; }
        .fold-icon { font-size: 14px; margin-left: 6px; color: #a0a0a0; transition: transform 0.2s; transform: rotate(0deg); }
        .category-title.collapsed .fold-icon { transform: rotate(-90deg); }
        
        /* 더보기 메뉴 컨테이너 */
        .more-menu-container { position: relative; display: inline-block; }
        .more-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; color: #6c757d; font-weight: bold; }
