<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 입출고 관리 시스템 (복구 모드)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #0d6efd; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #log { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ 자재 관리 시스템 (안전 실행 모드)</h2>
        <p>화면이 정상적으로 뜨는지 확인하는 기본 테스트 화면입니다.</p>
        
        <div class="form-group">
            <label>테스트 물품명</label>
            <input type="text" id="testName" value="기본 볼트">
        </div>
        <button class="btn" onclick="testConnection()">Supabase 통신 테스트</button>
        
        <div id="log">상태: 대기 중...</div>
    </div>

    <script>
        const BASE_URL = "https://kvfdfdcaidsdnohfcbeg.supabase.co/rest/v1";
        const API_KEY = "sb_publishable_AzZQ-7pqFS2klriLNXlCig_xRs8b1vV";

        const headers = {
            "apikey": API_KEY,
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        async function testConnection() {
            const logBox = document.getElementById('log');
            logBox.innerText = "Supabase 서버와 통신 중...";
            try {
                const response = await fetch(`${BASE_URL}/items?select=*`, { headers });
                if(response.ok) {
                    const data = await response.json();
                    logBox.innerText = `[성공] Supabase 연결 완료! 등록된 물품 수: ${data.length}개`;
                } else {
                    logBox.innerText = `[실패] 서버 응답 오류 코드: ${response.status}`;
                }
            } catch (err) {
                logBox.innerText = `[에러 발생] 통신 실패: ${err.message}\n(브라우저 확장 프로그램이나 방화벽이 차단하고 있을 수 있습니다)`;
            }
        }

        // 페이지 로드 시 자동 실행
        window.onload = function() {
            document.getElementById('log').innerText = "페이지가 정상적으로 로드되었습니다. 위의 버튼을 눌러 통신을 테스트하세요.";
        };
    </script>
</body>
</html>
